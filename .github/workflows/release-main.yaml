name: Release

on:
  # `push` rather than `pull_request: closed`: workflows triggered by a
  # pull_request event whose head lives in a fork run without repository
  # secrets, so the app-token step below aborted on every fork-PR merge
  # (issue #221). A push to main always runs in the base repo with
  # secrets, wherever the merged PR came from.
  push:
    branches:
      - main
  # Manual re-run, e.g. when release-please-action aborts without creating
  # a tag/release (see the manifest/GitHub-Releases reconciliation issue
  # fixed by this workflow's tag-scheme change) and `gh run rerun` doesn't
  # help because it replays the same event payload. Dispatching directly
  # re-invokes release-please against the current state of `main` instead.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}--${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      pull-requests: write
      contents: write
    steps:
      - name: Generate token for release-please
        id: gh_pr_token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2.1.0
        with:
          app_id: ${{ secrets.THIS_GITHUB_APP_ID }}
          private_key: ${{ secrets.THIS_GITHUB_APP_PRIVATE_KEY }}
          permissions: >-
            {"issues": "write", "pull_requests": "write", "contents": "write"}
          repositories: >-
            ["${{ github.event.repository.name }}"]

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.gh_pr_token.outputs.token }}
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/.manifest.json
          target-branch: main
